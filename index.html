<!-- Command / Einsatzführung Modal -->
    <div class="modal-overlay" id="command-modal">
        <div class="modal dispatch-modal-size" style="max-width: 600px; height: auto;">
            <div class="modal-header">
                <div>
                    <span id="cmd-modal-title" class="modal-title-main">Einsatzführung</span><br>
                    <span id="cmd-modal-sub" class="modal-title-sub">Warte auf Befehle...</span>
                </div>
                <button class="close-btn" onclick="closeModal('command-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="box-panel">
                    <div class="box-title">🚨 Kräfte vor Ort</div>
                    <ul id="cmd-on-scene-list" style="margin: 0; padding-left: 20px; font-size: 0.9rem; color: var(--color-return);"></ul>
                </div>
                
                <h3 style="margin-bottom: 5px; margin-top: 15px;">Befehle erteilen:</h3>
                <div id="cmd-actions" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Buttons werden per JS geladen -->
                </div>

                <button class="btn-nav" style="margin-top: 20px; width: 100%; border-color: var(--color-warning); color: var(--color-warning);" onclick="openDispatchModal(activeCommandMissionId); closeModal('command-modal');">
                    📡 Weitere Kräfte nachalarmieren
                </button>
            </div>
        </div>
    </div>
